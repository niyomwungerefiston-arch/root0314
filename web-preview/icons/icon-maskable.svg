<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed blue background (maskable safe zone is inner 80%) -->
  <rect width="512" height="512" fill="#1976D2"/>

  <!-- Orange circle centered in safe zone -->
  <circle cx="256" cy="256" r="130" fill="#F57C00"/>

  <!-- White "B" letter -->
  <text x="256" y="256"
        font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="170"
        font-weight="900"
        fill="#FFFFFF"
        text-anchor="middle"
        dominant-baseline="central">B</text>
</svg>
