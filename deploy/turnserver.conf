# Buchat — Configuration coturn (TURN/STUN server)
# Installer: apt install coturn
# Copier vers: /etc/turnserver.conf

# Network
listening-port=3478
tls-listening-port=5349

# Relay
min-port=49152
max-port=65535
relay-threads=4

# Auth
lt-cred-mech
user=buchat:buchat-turn-secret
realm=buchat.bujaonline.com

# Logging
log-file=/var/log/turnserver.log
verbose

# Performance
total-quota=100
stale-nonce=600

# Security
no-multicast-peers
