# ==========================================================
# Buchat — Configuration Nginx
# ==========================================================
#
# Sert sur buchat.bujaonline.com :
#   /                → landing page (website/)
#   /app/            → PWA (web-preview/)
#   /downloads/      → binaires (.exe, .apk, .dmg, .AppImage)
#   /api/*           → backend Node.js
#   /socket.io/*     → WebSocket (Socket.IO)
#   /preview/        → alias legacy vers /app/
#
# Installation (sur CT 109) :
#   sudo cp deploy/nginx-buchat.conf /etc/nginx/sites-available/buchat
#   sudo ln -s /etc/nginx/sites-available/buchat /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d buchat.bujaonline.com
#   sudo nginx -t && sudo systemctl reload nginx
# ==========================================================

upstream buchat_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ---------- HTTP → HTTPS redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name buchat.bujaonline.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name buchat.bujaonline.com;

    # SSL (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/buchat.bujaonline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buchat.bujaonline.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # Max upload size (5 Mo pour les messages vocaux)
    client_max_body_size 10M;

    # ---- Landing page (racine du site) ----
    root /opt/buchat/website;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # ---- PWA (l'application Buchat elle-même) ----
    location /app/ {
        alias /opt/buchat/web-preview/;
        try_files $uri $uri/ /app/index.html;

        # MIME type correct pour le manifest
        location ~* \.webmanifest$ {
            add_header Content-Type "application/manifest+json";
        }
        # Le service worker doit être servi avec scope racine-compatible
        location = /app/sw.js {
            add_header Service-Worker-Allowed "/app/";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Alias legacy : /preview/ redirige vers /app/
    location /preview/ {
        return 301 /app/;
    }

    # ---- Binaires téléchargeables ----
    location /downloads/ {
        alias /opt/buchat/website/downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";

        # Cache modéré (les utilisateurs revérifient en cas de nouvelle version)
        expires 1h;
        add_header Cache-Control "public, must-revalidate";

        # Tailles suffisantes pour les binaires Electron
        client_max_body_size 200M;
    }

    # ---- API REST backend ----
    location /api/ {
        proxy_pass http://buchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ---- Health check ----
    location = /health {
        proxy_pass http://buchat_backend;
        access_log off;
    }

    # ---- Socket.IO (WebSocket) ----
    location /socket.io/ {
        proxy_pass http://buchat_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Longues connexions persistantes
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering off;
    }

    # ---- Assets statiques du site vitrine ----
    location /assets/ {
        alias /opt/buchat/website/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /styles.css {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
