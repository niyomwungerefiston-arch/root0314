# Buchat — Configuration Nginx
# Copier vers: /etc/nginx/sites-available/buchat
# Activer: ln -s /etc/nginx/sites-available/buchat /etc/nginx/sites-enabled/
# Tester: nginx -t && systemctl reload nginx

upstream buchat_server {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name buchat.bujaonline.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name buchat.bujaonline.com;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/buchat.bujaonline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buchat.bujaonline.com/privkey.pem;

    # API & Socket.IO
    location / {
        proxy_pass http://buchat_server;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
